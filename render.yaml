services:
    - type: web
    name: pachapp-ai
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node pachapp-ai-cloud.js
    envVars:
            - key: GROQ_API_KEY
        sync: false
            - key: AIRTABLE_API_KEY
        sync: false
            - key: AIRTABLE_BASE_ID
        sync: false