<title>Pachapp Pool Villa — Booking Form</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;color:#fff;font-family:'Oswald','Arial Narrow',Arial,sans-serif;padding:18px 14px 40px}
  .wrap{max-width:560px;margin:0 auto}
  .logo-box{background:#fff;border-radius:22px;padding:22px 18px 18px;text-align:center;margin:6px auto 16px}

  .divider{height:1px;background:#333;margin:0 0 10px}
  label{display:block;color:#fff;font-weight:600;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;margin:24px 0 10px}
  .field{width:100%;border:1px solid #333;border-radius:10px;padding:15px;background:#0A0A0A;color:#fff;font-family:inherit;font-weight:600;letter-spacing:.08em;font-size:17px;outline:none}
  .field:focus{border-color:#fff;box-shadow:0 0 0 1px #fff}
  .field::placeholder{color:#E8E8E8;font-weight:500}
  textarea.field{min-height:150px;resize:vertical;line-height:1.5}

  .stepper{display:flex;align-items:center;justify-content:space-between;background:#000;border:1px solid #333;padding:10px 14px;min-height:58px}

  .step-btn:disabled{border-color:#1A2A5A;color:#1A2A5A;opacity:.6;cursor:not-allowed}
  /* CHANGE 1 - LIGHT BLUE for Adults / Kids only */
  .step-btn-light{border-color:#A8D4FF;color:#A8D4FF}
  .step-btn-light:disabled{border-color:#5A6A8A;color:#5A6A8A;opacity:.55}
  .step-val{font-size:18px;font-weight:600;letter-spacing:.08em;text-align:center;flex:1}
  .hint{color:#fff;font-size:14px;font-weight:500;letter-spacing:.02em;margin-top:10px;line-height:1.5}
  .red-line{color:#FF2D2D;font-weight:700;font-size:16px;letter-spacing:.04em;margin-top:8px}
  /* BOOKING TYPE */
  .booking-row{display:flex;gap:12px}
  .booking-opt{flex:1;padding:20px 10px;border-radius:16px;text-align:center;cursor:pointer}
  .booking-opt.selected{background:#fff;color:#000}
  .booking-opt.unselected{background:#2B2B2B;color:#fff}

  .booking-opt .t2{font-size:14px;font-weight:600;letter-spacing:1px;margin-top:8px}
