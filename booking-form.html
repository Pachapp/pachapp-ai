<!-- QR - shows only when Pay Advance is tapped -->
<div id="qrBox" style="display:none; text-align:center; background:#ffffff; padding:12px; border-radius:12px; margin-top:12px;">
  <img src="qr.png" alt="PhonePe QR" style="width:100%; max-width:320px; display:block; margin:0 auto;">
</div>
<button onclick="document.getElementById('qrBox').style.display='block'" style="background:#1db954; color:#fff; padding:14px; width:100%; border:none; border-radius:12px; font-weight:bold;">
  Pay Advance - QR
</button>
